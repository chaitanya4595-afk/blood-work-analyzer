[project]
name = "blood-work-analyzer"
version = "0.1.0"
description = "Two-stage LLM pipeline for structured blood-work extraction and plain-language interpretation."
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.57",
    "langchain-core>=1.6",
    "langchain-google-genai>=4.4",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blood_work_analyzer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
